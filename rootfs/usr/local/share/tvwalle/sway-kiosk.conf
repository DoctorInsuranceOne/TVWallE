# TVWallE: sway configured as a kiosk. One window (Firefox), full screen,
# no bar, no keyboard shortcuts.
# Installed by TVWallE provision/install.sh. Started by tvwalle-kiosk.service.

# Nothing on the kiosk needs X11.
xwayland disable

# Until Firefox draws: the boot splash's logo, same size and place as
# Plymouth's (a 16:9 canvas with the logo at 40% of the width, scaled to the
# screen), on black.
output * bg /usr/local/share/tvwalle/splash-3840x2160.png fit #000000

# No borders or title bars, and no bar (none is configured).
default_border none
default_floating_border none

# A mouse works: the pointer shows while it moves and hides 3 seconds after it
# stops. The TV dashboard page hides it after the same 3 seconds, so the two
# agree. A kiosk with no mouse never shows one.
seat * hide_cursor 3000

# Every window full screen. Firefox's kiosk mode asks for it; this also covers
# any other window it opens.
for_window [app_id=".*"] fullscreen enable

# Start the browser. When it exits, kiosk-session ends sway, so systemd starts
# both again.
exec /usr/local/lib/tvwalle/kiosk-session
