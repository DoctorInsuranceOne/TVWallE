# TVWallE: SSH with a key only. Installed by TVWallE provision/install.sh.
#
# Named 10- on purpose: sshd keeps the FIRST value it reads for a setting, and
# Ubuntu's installer leaves 50-cloud-init.conf with PasswordAuthentication yes.
# The setup installs this only when an admin (group sudo) already has a key in
# ~/.ssh/authorized_keys, so it can't lock everyone out.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
