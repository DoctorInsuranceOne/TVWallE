# TVWallE: sound comes out of the screen (HDMI or DisplayPort, including a
# DisplayPort-to-HDMI cable), at full volume so the TV's remote sets how loud,
# and never out of the PC's own speaker, headphone jack or line out. With the
# screen off or unplugged nothing plays anywhere.
# Installed by TVWallE provision/install.sh; read by WirePlumber 0.5 in the
# kiosk user's session. Check with: sudo tvwalle-sound

monitor.alsa.rules = [
  # The screen's sound: the default output whenever a screen with sound is
  # connected. 2500 is above any PC output (analog is about 1000).
  {
    matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
    actions = {
      update-props = {
        priority.session = 2500
        priority.driver = 2500
      }
    }
  }
  # The PC's own outputs (analog: speaker, headphones, line out; and S/PDIF):
  # switched off, so sound can't end up there.
  {
    matches = [ { node.name = "~alsa_output.*(analog|iec958).*" } ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]

wireplumber.settings = {
  # New outputs start at full volume (WirePlumber's own default is 40%).
  device.routes.default-sink-volume = 1.0
}
