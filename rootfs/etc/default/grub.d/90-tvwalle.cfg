# TVWallE: a quiet boot that shows only the splash.
# Installed by TVWallE provision/install.sh. Read after /etc/default/grub.
#
# No menu and no wait. To reach the menu anyway (recovery), press Esc
# repeatedly (UEFI) or hold Shift (BIOS) right after power-on.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=0
# Ubuntu shows the menu for 30 s after a boot that didn't finish (a power cut
# while starting). A TV has nobody to choose, so boot straight on.
GRUB_RECORDFAIL_TIMEOUT=0

# Appended, not replaced, so other drop-ins (kdump's crashkernel=) keep theirs.
#   quiet splash            Plymouth instead of kernel and systemd text
#   loglevel=3              only kernel errors reach the console
#   rd.udev.log_level=3     same for udev in the boot image
#   vt.global_cursor_default=0  no blinking text cursor between screens
#   plymouth.ignore-serial-consoles
#                           Plymouth falls back to plain text whenever a serial
#                           console is attached (the ARM dev VM has ttyAMA0 from
#                           its firmware; some PCs do too), even with "splash".
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 plymouth.ignore-serial-consoles"
