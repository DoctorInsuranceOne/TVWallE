# TVWallE boot splash. Installed by TVWallE provision/install.sh.
# The rest of Plymouth's settings come from /usr/share/plymouth/plymouthd.defaults.
#
# ThemeDir is required, not decoration: plymouth-populate-initrd (which
# dracut runs to put the theme in the boot image) only honours Theme= when
# ThemeDir/Theme exists, and otherwise copies a theme called "none".
[Daemon]
ThemeDir=/usr/share/plymouth/themes
Theme=tvwalle
